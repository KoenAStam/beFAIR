version: 1.1
authors: K.A. Stam; F. de Weijer
created_at: 2025-11-19
name: analysis_som
description: |
  Extension of the analysis table for Self-Organizing Map (SOM) analyses. Contains SOM-specific
  metadata such as pipeline location and description. Can be linked to the main analysis table
  using analysis_id.
variables:
  analysis_id:
    description: ID given to the analysis
    foreign_key: analysis.analysis_id
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []
        - col_vals_not_null:
            label: "Analysis ID is required"

  SOM_settings:
    description: placeholder
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
          - col_is_character: []

