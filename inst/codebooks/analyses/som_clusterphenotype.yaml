version: 1.1
authors: K.A. Stam; F. de Weijer
created_at: 2025-11-19
name: som_clusterphenotype
description: |
  Table containing SOM cluster phenotype metadata for each analysis. Each record represents a
  measurement for a specific cluster (cluster_id) and marker (marker_name) within an analysis.
  The measurement column indicates the type (e.g., phenotype, percentile, min, max), and the
  value column contains the corresponding numeric value.
variables:
  analysis_id:
    description: Analysis ID; foreign key
    foreign_key: analysis.analysis_id
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []
        - col_vals_not_null:
            label: "Analysis ID is required"

  cluster_id:
    description: ID given to the cluster; (e.g in format c1, c71)
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
      - col_is_character: []

  marker_name:
    description: Name of the marker
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
      - col_is_character: []

  measurement:
    description: Type of measurement per cluster (e.g. percentile, min, max). Values of phenotype can be -1, 0 or 1.
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
      - col_is_character: []
      - col_vals_in_set:
          set:
            - phenotype
            - median
            - ptile_80
            - ptile_95
            - ptile_99
            - min
            - max
            - std

  value:
    description: Value of the measurement
    units: ~
    type: numeric
    type_sql: DECIMAL
    categories: ~
    labels: ~
    validations:
      - col_is_numeric: []

  script_id:
    description: Identifier of the source script that produced this dataset. Automatically filled during the database update. Equals the relative path of the script inside the FAIRground.
    foreign_key: table_script.script_id
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
