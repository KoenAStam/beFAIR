version: 7.0
authors: K.A. Stam; F. de Weijer
created_at: 2025-11-19
name: luminex_measurement
description: |
  Table containing processed Luminex measurements per participant timepoint.
  Each row represents the measurement of a analyte/target for one
  participant event (event_id) within one analysis (analysis_id).
variables:
  analysis_id:
    description: Analysis ID; foreign key
    foreign_key: analysis.analysis_id
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []
        - col_vals_not_null:
            label: "Analysis ID is required"

  source_id:
    description: Original ID given to the participant during the study.
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []

  study_id:
    description: ID given to the study or trial for this source id; foreign key to study.
    foreign_key: study.study_id
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []

  timepoint:
    description: Timepoint in days relative to start of the study.
    units: days
    type: integer
    type_sql: INT
    categories: ~
    labels: ~
    validations:
        - col_is_numeric: []

  participant_id:
    description: ID given to the participant; foreign key. Automatically filled in.
    foreign_key: participant.participant_id
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~

  event_id:
    description: Identifier for the event (sample). Consist of participant id and timepoint in days. Automatically filled in.
    foreign_key: event.event_id
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~

  sample_type:
    description: Type of sample used in the assay
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: plasma;serum
    labels: ~
    validations:
      - col_is_character: []
      - col_vals_in_set:
          set:
            - plasma
            - serum

  target:
    description: What target is measured. E.g. IL-5, IgG1[Cathepsin_B], total IgG, or Sm-p80
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
      - col_is_character: []

  measurement:
    description: >
      Type of readout produced by the assay for the given target,
      e.g. concentration, raw MFI, or avidity (relative binding strength).
    type: character
    type_sql: VARCHAR(255)
    categories: concentration;mfi;avidity
    labels: ~
    validations:
      - col_is_character: []
      - col_vals_in_set:
          set:
            - concentration
            - mfi
            - avidity

  value:
    description: measured value of the given target. Check 'unit' for the given units
    units: ~
    type: numeric
    type_sql: DECIMAL
    categories: ~
    labels: ~
    validations:
      - col_is_numeric: []

  unit:
    description: Unit of the give value. E.g. "pg/mL", kg, mfi, ratio.
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
      - col_is_character: []

  script_id:
    description: Identifier of the source script that produced this dataset. Automatically filled during the database update. Equals the relative path of the script inside the FAIRground.
    foreign_key: table_script.script_id
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
