version: 1.3
authors: K.A. Stam; F. de Weijer
created_at: 2025-11-19
name: id_mapping
description: |
  Mapping table between original source identifiers (as recorded in study data files) and the
  anonymized participant_id generated by beFAIR. Each row links one source_id to a participant_nr
  and the corresponding anonymized participant_id. Multiple source_id values can map to the same
  participant_nr when a participant appears under different IDs across data sources or timepoints.
  This table is the basis for participant de-identification and is always processed first during
  each database update.
variables:
  participant_nr:
    description: Sequential integer assigned to a participant within the ID mapping table.
      It serves as the basis for generating the anonymized participant_id via a SHA-256 hash,
      and links one or more source_id values (e.g., from different data sources or time points)
      to a single individual.
    units: ~
    type: integer
    type_sql: INT
    categories: ~
    labels: ~
    validations:
        - col_is_integer: []
        - col_vals_not_null:
            label: "Participant nr is required"

  source_id:
    description: Raw participant identifier as recorded in the original data source (e.g.,
      a clinical trial database or laboratory system). Multiple source_id values may map
      to the same participant_nr when a participant appears under different IDs across
      data sources or studies. Reserved control/blank identifiers ("BLANK", "STD",
      "NEG_CTRL", "POS_CTRL") are never entered in this table and are skipped
      automatically during source ID validation.
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []
        - col_vals_not_null:
            label: "Source ID is required"

  participant_id:
    description: Anonymized participant identifier assigned during the database update.
      Derived by computing the SHA-256 hash of the concatenation "<study_id>_<NNNN>"
      (where NNNN is the zero-padded participant_nr) and taking the first 6 hexadecimal
      characters, resulting in the format "<study_id>_<hash6>" (e.g., "CapTan_a3f2b1").
    foreign_key: participant.participant_id
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~

  study_id:
    description: Identifier of the study or clinical trial to which this ID mapping entry
      belongs.
    foreign_key: study.study_id
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []
        - col_vals_not_null:
            label: "Study ID is required"

  script_id:
    description: Identifier of the source script that produced this dataset.
      Automatically filled during the database update. Equals the relative path of the
      script inside the FAIRground (e.g. "\studies\CapTan\scripts\participant").
    foreign_key: table_script.script_id
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
