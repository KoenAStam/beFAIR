version: 4.0
authors: L.R. Pelgrom; K.A. Stam; F. de Weijer
created_at: 2025-12-25
name: adverse_event
description: |
  Table containing all adverse events reported in the study. Each record corresponds to a single
  adverse event and is linked to a specific participant via participant_id, providing details about
  the occurrence and characteristics of that event (severity, relation to intervention, dates, etc.).
variables:
  adverse_event_id:
    description: Unique identifier for the adverse event. Format is study_id + "ae" + a 4-digit number
      (e.g., "CHSI1ae0001").
    primary_key: true
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []
        - col_vals_not_null:
            label: "Adverse Event ID is required"
        - rows_distinct:
            label: "Adverse Event IDs are unique"

  source_id:
    description: Original ID given to the participant during the study.
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []
        - col_vals_not_null:
            label: "Source ID is required"

  participant_id:
    description: Identifier of the participant who experienced this adverse event.
    foreign_key: participant.participant_id
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~

  study_id:
    description: ID given to the study or trial; foreign key to study.
    foreign_key: study.study_id
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []
        - col_vals_not_null:
            label: "Study ID is required"

  description:
    description: verbatim description of the adverse event.
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []

  clinical_condition_code:
    description: dictionary-derived code. Like "R51" for headache according to the ICD-10.
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []

  code_classification_system:
    description: dictionary name and version used to map description to code. Like "ICD-10 Version:2019".
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []

  location:
    description: relevent anatomical location. Like "arm" for skin rash. Only required when missing from description and code.
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []

  severity:
    description: severity or intensity of the event on a three-point scale from mild to severe.
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []

  serious:
    description: is this a 'serious' event, yes or no, as defined by the ICH E2A.
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []

  relation:
    description: opinion on causality between event and intervention on a five-point scale from defintely not related to defintely related.
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []

  additional_treatment_given:
    description: was another treatment given because of the event? Valid are "Y" and "N".
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []

  additional_treatment_name:
    description: verbatim name of the additional drug, medication or therapy.
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []

  start_date:
    description: Start date of the adverse event in ISO 8601 character format (YYYY-MM-DD).
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []

  end_date:
    description: End date of the adverse event in ISO 8601 character format (YYYY-MM-DD).
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []

  start_timepoint:
    description: start of the event relative to the participants reference start date.
    units: days
    type: integer
    type_sql: INT
    categories: ~
    labels: ~
    validations:
        - col_is_numeric: []

  end_timepoint:
    description: end of the event relative to the participants reference start date.
    units: days
    type: integer
    type_sql: INT
    categories: ~
    labels: ~
    validations:
        - col_is_numeric: []

  registration_timepoint:
    description: timepoint when the adverse event was recorded.
    units: days
    type: integer
    type_sql: INT
    categories: ~
    labels: ~
    validations:
        - col_is_numeric: []

  script_id:
    description: Identifier of the source script that produced this dataset.
      Automatically filled during the database update. Equals the relative path of the
      script inside the FAIRground (e.g. "\studies\CapTan\scripts\adverse_event").
    foreign_key: table_script.script_id
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
