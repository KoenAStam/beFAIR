version: 1.1
authors: K.A. Stam; F. de Weijer
created_at: 2025-11-19
name: experiment_luminex
description: |
  Extension of the experiment table for Luminex experiments. Contains Luminex-specific metadata.
  Each row can be linked back to the main experiment table via experiment_id.
variables:
  experiment_id:
    description: Identifier of the experiment; links to the experiment table.
    foreign_key: experiment.experiment_id
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []
        - col_vals_not_null:
            label: "Experiment ID is required"

  luminex_type:
    description: Type of luminex
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: levels;functionality;avidity
    labels: ~
    validations:
      - col_is_character: []
      - col_vals_in_set:
          set:
            - levels
            - functionality
            - avidity

  functional_assay:
    description: Assay used to measure functionality, if applicable
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: NA;FcAR;FcgR2a;FcgR2b;FcgR3a(V);FcgR3b;C1q
    labels: ~
    validations:
      - col_is_character: []
      - col_vals_in_set:
          set:
            - NA
            - FcAR
            - FcgR2a
            - FcgR2b
            - FcgR3a(V)
            - FcgR3b
            - C1q

  number_of_plates:
    description: Total number of plates measured during the experiment
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
      - col_is_character: []

  urea: # experiment level?
    description: Whether urea was added
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: yes;no
    labels: ~
    validations:
      - col_is_character: []
      - col_vals_in_set:
          set:
            - yes
            - no
