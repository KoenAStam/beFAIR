version: 3.1
authors: K.A. Stam; F. de Weijer
created_at: 2025-11-19
name: aurorabarcodingscheme
description: |
  Table storing the barcoding schemes used in an Aurora spectral flow cytometry experiment.
  Each row corresponds to one barcoding scheme entry and is linked to both the experiment and
  a specific participant sample via the event. Captures the fluorochromes and binary encoding
  used to multiplex samples.
variables:
  experiment_id:
    description: Experiment ID; foreign key
    foreign_key: experiment.experiment_id
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []
        - col_vals_not_null:
            label: "Experiment ID is required"

  source_id:
    description: Original ID given to the participant during the study.
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []

  study_id:
    description: ID given to the study or trial for this source id; foreign key to study.
    foreign_key: study.study_id
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []

  timepoint:
    description: Timepoint in days relative to start of the study.
    units: days
    type: integer
    type_sql: INT
    categories: ~
    labels: ~
    validations:
        - col_is_numeric: []

  participant_id:
    description: ID given to the participant; foreign key. Automatically filled in.
    foreign_key: participant.participant_id
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~

  event_id:
    description: Identifier for the event (sample). Consist of participant id and timepoint in days. Automatically filled in.
    foreign_key: event.event_id
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~

  batch_id:
    description: Identifier for which batch this event (sample) came from
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
      - col_is_character: []

  barcode_fluorochrome:
    description: List of which fluorochromes are used for the barcoding scheme, character separated by a comma e.g. BUV661, BV740, RB744
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
      - col_is_character: []

  barcode_scheme:
    description: The barcode scheme encoded with 1's and 0's corresponding to the list specified in barcode_fluorochrome, character separated by a comma e.g. 1, 1, 0, 0, 0, 0
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
      - col_is_character: []

  script_id:
    description: Identifier of the source script that produced this dataset. Automatically filled during the database update. Equals the relative path of the script inside the FAIRground.
    foreign_key: table_script.script_id
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
