version: 5.0
authors: K.A. Stam; F. de Weijer
created_at: 2025-11-19
updated_at: 2026-08-19
name: table_script
description: |
  Internal registry table tracking all ETL scripts processed by beFAIR.
  Each row represents one ETL script run, identified by its relative file path within the FAIRground folder.
  This table is maintained automatically during databaseUpdate() and is not intended to be populated manually.
variables:
  script_id:
    description: Unique identifier of the script, equal to its path relative to the
      FAIRground (e.g. "\studies\CapTan\scripts\participant.R").
    primary_key: true
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
      - col_is_character: []
      - col_vals_not_null:
          label: "A script id is required"

  script_hash:
    description: MD5 hash of the script file. Read-in with `readLines`, used to
      check if the script had any changes compared to the `table_script in the
      database.
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
      - col_is_character: []
      - col_vals_not_null:
          label: "A script hash is required"

  codebook_name:
    description: Name of the codebook that the ETL script is related to. In most
      scenarios this is equal the name of the script file and table name in the
      database.
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
      - col_is_character: []

  codebook_version:
    description: Current version of the codebook that the ETL script is related to.
      major and minor annotation (e.g. 2.1, 3.0). During `database_update`, if the ETL script is
      behind a major version, the ETL script will be queued for updating.
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
      - col_is_character: []

  created_at:
    description: Date and time of creation for ETL script in ISO 8601 format(YYYY-MM-DD).
      The date corresponds with the first time the script is added to the 'table_script' table.
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []

  updated_at:
    description: Date and time of last modification of script in ISO 8601 format(YYYY-MM-DD).
      The date corresponds with the last time that the ETL succesfully ran and the matching data was added to the database.
    units: ~
    type: character
    type_sql: VARCHAR(255)
    categories: ~
    labels: ~
    validations:
        - col_is_character: []

  run_time:
    description: Time in seconds how long it took to run `sourceScript` on the
     given ETL script.
    units: ~
    type: numeric
    type_sql: DECIMAL
    categories: ~
    labels: ~
    validations:
      - col_is_character: []

  flag_TODO:
    description: Number of `TODO` flags that are used in the ETL-script. If this
      is not zero, it could be that the underlying data has some unseen
      underlying assumptions.
    units: ~
    type: numeric
    type_sql: INT
    categories: ~
    labels: ~
    validations:
      - col_is_numeric: []

  flag_WARN:
    description: Number of warnings when sourcing the ETL-script. This includes
      the warnings generated by pointblank validation.
    units: ~
    type: numeric
    type_sql: INT
    categories: ~
    labels: ~
    validations:
      - col_is_numeric: []

  suspended:
    description: Flag indicating whether the ETL script is suspended (1) or active (0).
      A suspended script has a filename starting with `_` and is skipped during
      databaseUpdate(). Its table_script record is kept for reference.
    units: ~
    type: numeric
    type_sql: INT
    categories: ~
    labels: ~
    validations:
      - col_is_numeric: []

  entries_in_database:
    description: Flag indicating whether at least one row in the target data table
      has this script_id (1) or not (0). Updated on each databasePrepareScripts()
      and databaseUpdate() run.
    units: ~
    type: numeric
    type_sql: INT
    categories: ~
    labels: ~
    validations:
      - col_is_numeric: []

  queued_for_update:
    description: Flag indicating whether databaseUpdate() should (re-)run this script
      (1) or skip it (0). Set to 1 when a new script is discovered, the script hash
      changes, or the codebook version advances. Reset to 0 after a successful run.
    units: ~
    type: numeric
    type_sql: INT
    categories: ~
    labels: ~
    validations:
      - col_is_numeric: []
