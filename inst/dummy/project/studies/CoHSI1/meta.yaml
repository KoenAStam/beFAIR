primary_outcome: Safety and tolerability of controlled human Schistosoma mansoni infection,
  Infection rate as measured by serum anti-SEA IgG antibodies
summary: |-
  CoHSI1 is a controlled human infection study to evaluate the safety and immunogenicity
  of Schistosoma mansoni cercariae infection in healthy adult volunteers.

  Volunteers are exposed to a defined number of cercariae and followed over 28 days to
  assess infection development, immune responses, and safety endpoints.
description: |-
  COHSI-001 is a single-centre, open-label controlled human Schistosoma mansoni infection
  (CHSI) study in healthy adult volunteers. Participants receive a defined dose of
  S. mansoni cercariae by skin exposure and are monitored over 28 days.

  The study aims to establish a safe and reproducible CHSI model that can be used for
  vaccine efficacy testing and immunological research.
