  - title: "Database"
    desc: "Connect to and manage the FAIRground database."
    contents:
      - FAIRgroundConnect
      - FAIRgroundConnection
      - FAIRgroundDisconnect
      - databaseInitialize
      - databaseUpdate
      - databasePrepareProjects
      - databasePrepareDatasources
      - databasePrepareDependencies
