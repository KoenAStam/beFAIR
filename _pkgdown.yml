articles:
  - title: "Overview"
    desc: "Introduction to beFAIR and its three data pillars."
    contents:
      - start_here
      - overview
  - title: "Exploring the database"
    desc: "For users who want to connect and query an existing FAIRground database."
    contents:
      - database_smoke_test
      - exploring_and_joining_data_tables
  - title: "Adding data and writing ETL scripts"
    desc: "For users who contribute data by writing ETL scripts for studies, experiments, or analyses."
