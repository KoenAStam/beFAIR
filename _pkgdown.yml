url: https://data.hypovax.org/beFAIR/

exclude:
 - CLAUDE.md

template:
  bootstrap: 5
  theme: gruvbox-light
  bslib:
    base_font: system-ui

home:
  title: beFAIR
  description: Codebook-Driven ETL Framework for Clinical Research Data

navbar:
  structure:
    left:  [home, articles, reference, news]
    right: [search, source, lightswitch]
  components:
    source:
      text: Source
      href: "https://git.lumc.nl/fdeweijer/supervaxr.git"

